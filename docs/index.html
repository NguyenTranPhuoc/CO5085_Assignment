<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Landing Page - Học sâu & Thị giác máy tính</title>
    
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #2980b9;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #7f8c8d;
            --border-color: #e0e6ed;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.7; 
            margin: 0; 
            padding: 40px 20px; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 40px 50px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        h1 { 
            color: var(--primary); 
            font-size: 2.2em; 
            border-bottom: 3px solid var(--secondary); 
            padding-bottom: 15px; 
            margin-top: 0;
            margin-bottom: 25px; 
        }
        h2 { 
            color: var(--primary); 
            margin-top: 35px; 
            font-weight: 600; 
            font-size: 1.5em;
        }
        h3 { 
            color: var(--secondary); 
            margin-top: 0; 
            font-size: 1.25em;
        }
        p { margin-bottom: 15px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
        a { 
            color: var(--secondary); 
            text-decoration: none; 
            font-weight: 500; 
            transition: all 0.3s ease; 
        }
        a:hover { 
            color: var(--primary); 
            text-decoration: underline; 
        }
        .task { 
            margin-top: 25px; 
            margin-bottom: 25px; 
            padding: 25px; 
            border-left: 5px solid var(--secondary); 
            background: #f8fbfb; 
            border-radius: 0 8px 8px 0; 
            transition: transform 0.2s ease, box-shadow 0.2s ease; 
        }
        .task:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .nav-links {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }
        .nav-links li {
            margin: 0;
        }
        .nav-links li a {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
        }
        .nav-links li a:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(41, 128, 185, 0.3);
        }
    </style>

</head>
